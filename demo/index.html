    // Загрузчик Rockstat SDK (аналог snippet/snippet.html, но под window.rstat4)
    (function (w) {
      if (w.rstat4) return;
      var rst = w.rstat4 = function () {
        var a = Array.prototype.slice.call(arguments);
        return rst.doCall ? rst.doCall.call(rst, a) : (rst._q.push(a) && 0);
      };
      rst.push = rst;
      rst._sv = '5.1.1';
      rst._q = [];
    })(window);

    rstat4('configure', {
      projectId: 1,
      server: location.host,
      allowHTTP: true, // демо крутится на http://localhost (secure context для WebCrypto)
      trackPages: true,

      trackForms: {
